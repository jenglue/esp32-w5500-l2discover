<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Lite Pro | 網路分析儀</title>
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; }
        * { box-sizing: border-box; }
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Segoe UI', 'Courier New', monospace; 
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100dvh; margin: 0; padding: 12px;
            overflow: hidden;
        }
        h1 { 
            text-transform: uppercase; letter-spacing: 5px; font-size: 1.6rem;
            text-shadow: 0 0 10px var(--neon-blue);
            color: var(--neon-blue); margin: 0 0 12px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-blue); border-radius: 15px; padding: 16px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            width: min(90vw, 440px); max-height: calc(100dvh - 72px);
        }
        .data-field {
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
            border-bottom: 1px solid #333; padding: 7px 0;
        }
        .label { font-size: 0.75rem; color: #888; text-transform: uppercase; }
        .value {
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 1.15rem; font-weight: bold; color: var(--neon-purple);
            text-shadow: 0 0 5px var(--neon-purple); text-align: right;
        }
        .container > .data-field:last-of-type { margin-bottom: 12px; }
        button {
            background: transparent; border: 2px solid var(--neon-blue);
            color: var(--neon-blue); padding: 9px 18px; font-size: 0.9rem;
            cursor: pointer; border-radius: 50px; transition: 0.3s;
            text-transform: uppercase; font-weight: bold;
        }
        button:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 30px var(--neon-blue); }
        #status { margin-top: 8px; font-size: 0.8rem; color: #555; }

        @media (max-height: 500px) {
            body { padding: 6px; }
            h1 { font-size: 1.25rem; margin-bottom: 6px; }
            .container { padding: 8px 12px; max-height: calc(100dvh - 36px); }
            .data-field { padding: 4px 0; }
            .value { font-size: 1rem; }
            .container > .data-field:last-of-type { margin-bottom: 6px; }
            button { padding: 6px 14px; }
            #status { margin-top: 4px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <h1>Net-Scanner</h1>

    <div class="container">
        <div class="data-field">
            <div class="label">Switch Hostname</div>
            <div id="swName" class="value">OFFLINE</div>
        </div>
        <div class="data-field">
            <div class="label">Interface Name</div>
            <div id="swPort" class="value">---</div>
        </div>
        <div class="data-field">
            <div class="label">VLAN</div>
            <div id="swVlan" class="value">N/A</div>
        </div>
        <div class="data-field">
            <div class="label">IP Address</div>
            <div id="ipAddress" class="value">---</div>
        </div>
        <div class="data-field">
            <div class="label">Gateway</div>
            <div id="gateway" class="value">---</div>
        </div>
        <div style="text-align: center;">
            <button onclick="connectBLE()">Connect Sensor</button>
            <div id="status">等待藍牙連線...</div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        const decoder = new TextDecoder('utf-8');
        let connectedDevice;

        function handleDisconnect() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "藍牙已斷線";
            statusEl.style.color = "#ffcc00";
        }

        function updateDiscoveryData(value) {
            const parts = decoder.decode(value).split('|');

            document.getElementById('swName').innerText = parts[0] || "Unknown";
            document.getElementById('swPort').innerText = parts[1] || "Unknown";
            document.getElementById('swVlan').innerText = parts[2] || "N/A";
            document.getElementById('ipAddress').innerText = parts[3] || "Unknown";
            document.getElementById('gateway').innerText = parts[4] || "Unknown";
        }

        async function connectBLE() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "正在請求裝置...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'T-Lite-Sniffer' }],
                    optionalServices: [SERVICE_UUID]
                });
                connectedDevice = device;
                device.addEventListener('gattserverdisconnected', handleDisconnect);

                statusEl.innerText = "正在連線伺服器...";
                const server = await device.gatt.connect();
                
                statusEl.innerText = "正在獲取服務...";
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                const characteristic = await service.getCharacteristic(CHAR_UUID);

                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    updateDiscoveryData(event.target.value);
                });
                await characteristic.startNotifications();
                updateDiscoveryData(await characteristic.readValue());

                statusEl.innerText = "連線成功！監聽數據中...";
                statusEl.style.color = "#00ff00";

            } catch (error) {
                console.error(error);
                statusEl.innerText = "連線失敗: " + error;
                statusEl.style.color = "#ff0000";
            }
        }

        window.addEventListener('beforeunload', () => {
            if (connectedDevice?.gatt.connected) {
                connectedDevice.gatt.disconnect();
            }
        });
    </script>
</body>
</html>
